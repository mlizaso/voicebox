# Voicebox — CPU build (default)
# For AMD ROCm GPU acceleration use the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up --build

services:
  voicebox:
    build: .
    container_name: voicebox
    restart: unless-stopped

    ports:
      # Host-side moved to 17600 so the dev/installed Voicebox can keep 17493.
      # Container still listens on its native port internally.
      - "127.0.0.1:17600:17493"

    volumes:
      # Bind-mount for generated audio (customize the host path as needed)
      # Host side:      ./output/
      # Container side: /app/data/generations/
      - ./output:/app/data/generations

      # Named volume for profiles, DB, cache (persists across container restarts)
      - voicebox-data:/app/data

      # HuggingFace model cache (so models aren't re-downloaded on rebuild)
      - huggingface-cache:/home/voicebox/.cache/huggingface

    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      # The ./output bind mount is an intentional host-facing export directory.
      # DB, profiles, cache, captures, and logs remain private.
      - VOICEBOX_SHARED_GENERATIONS=1
      # Docker bridge peers are intentionally treated as network clients. Set
      # a persistent, randomly generated token before `docker compose up`.
      - VOICEBOX_REMOTE_API_TOKEN=${VOICEBOX_REMOTE_API_TOKEN:?Set a 32+ character URL-safe remote API token}
      # The published host listener above is loopback-only, but the final hop
      # across Docker's private bridge is HTTP and therefore needs the explicit
      # compatibility override. Do not copy this setting to a public binding.
      - VOICEBOX_ALLOW_INSECURE_REMOTE_HTTP=1

    networks:
      - voicebox-net

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

networks:
  voicebox-net:
    driver: bridge

volumes:
  voicebox-data:
  huggingface-cache:
